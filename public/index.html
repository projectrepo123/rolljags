<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jaguar Football</title>
  <link rel="icon" href="/logo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="description" content="Game photos for Jaguar Football, sorted by week. Browse the gallery and download full-resolution shots for free." />
  <link rel="canonical" href="https://rolljags.com/" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <meta property="og:title" content="Jaguar Football" />
  <meta property="og:description" content="Season photos for Jaguar Football. Browse by week and download full-resolution photos." />
  <meta property="og:image" content="https://rolljags.com/logo.webp" />
  <meta property="og:url" content="https://rolljags.com/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img class="site-logo" src="/logo.webp" alt="Jaguar Football logo" />
        <h1>Jaguar Football</h1>
      </a>
      <nav class="site-nav">
        <div class="nav-links" id="nav-links">
          <a href="/" class="active">Photos</a>
          <a href="/schedule">Schedule</a>
          <a href="/history">History</a>
          <a href="/records">Records</a>
          <a href="/podcast">Podcast</a>
        </div>
        <span class="kickoff-countdown" id="kickoff-countdown" hidden>
          <span class="kickoff-label" id="kickoff-label">Kickoff</span>
          <span class="kickoff-clock" id="kickoff-clock"></span>
        </span>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div class="photo-banner" id="photo-banner" hidden aria-label="Old season photos">
      <div class="photo-banner-track" id="photo-banner-track"></div>
      <span class="photo-banner-label" aria-hidden="true">From the Archives</span>
    </div>
    <div class="container">
      <div id="weeks">
        <p class="sr-only" role="status">Loading photos</p>
        <div class="week-grid" aria-hidden="true">
          <div class="skeleton-card">
            <div class="skeleton skeleton-cover"></div>
            <div class="skeleton-body">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton skeleton-cover"></div>
            <div class="skeleton-body">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton skeleton-cover"></div>
            <div class="skeleton-body">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
        </div>
        <noscript><p class="empty-state">Photos need JavaScript enabled to load.</p></noscript>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Jaguar Football</p>
      <p class="footer-credit">Photos and Website by <a href="https://jbwebco.com">Jon Baer</a></p>
    </div>
  </footer>

  <script src="/js/home.js" type="module"></script>
</body>
</html>
