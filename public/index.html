<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seckman Jaguars Football | Game Photos &amp; Schedule</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#142c52" />
  <!-- @font-face lives inside the render-blocking stylesheet, so without this
       the font request cannot start until the CSS has parsed and the masthead
       visibly reflows. crossorigin is required even same-origin for fonts. -->
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <!-- home.js imports banner.js -> lightbox.js -> likes.js, and only fetches
       the week list once all four have loaded one after another. Starting them
       and the week list together takes that waterfall off the hero's paint. -->
  <link rel="modulepreload" href="/js/home.js" />
  <link rel="modulepreload" href="/js/banner.js" />
  <link rel="modulepreload" href="/js/lightbox.js" />
  <link rel="modulepreload" href="/js/likes.js" />
  <link rel="preload" href="/api/weeks" as="fetch" crossorigin="anonymous" />
  <meta name="description" content="Game day photos and schedule for Seckman High School Jaguars football in Imperial, MO. Browse by week, download full-resolution photos for free." />
  <link rel="canonical" href="https://rolljags.com/" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <meta property="og:title" content="Seckman Jaguars Football | Game Photos &amp; Schedule" />
  <meta property="og:description" content="Game day photos and schedule for Seckman High School Jaguars football in Imperial, MO. Browse by week, download full-resolution photos for free." />
  <meta property="og:site_name" content="Seckman Jaguars Football" />
  <meta property="og:image" content="https://rolljags.com/og-default.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://rolljags.com/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Explicit local signal. The site was matching bare "jaguar" queries from
       outside the US with nothing tying it to Imperial, MO. Coordinates are
       the town center, not the school building. -->
  <meta name="geo.region" content="US-MO" />
  <meta name="geo.placename" content="Imperial" />
  <meta name="geo.position" content="38.3706;-90.3779" />
  <meta name="ICBM" content="38.3706, -90.3779" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://rolljags.com/#website",
        "url": "https://rolljags.com/",
        "name": "Seckman Jaguars Football",
        "description": "Game day photos and schedule for Seckman High School Jaguars football in Imperial, MO."
      },
      {
        "@type": "SportsTeam",
        "@id": "https://rolljags.com/#team",
        "name": "Seckman Jaguars",
        "alternateName": "Seckman High School Jaguars",
        "sport": "American Football",
        "url": "https://rolljags.com/",
        "logo": "https://rolljags.com/logo.webp",
        "parentOrganization": {
          "@type": "HighSchool",
          "name": "Seckman High School",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "2800 Seckman Road",
            "addressLocality": "Imperial",
            "addressRegion": "MO",
            "postalCode": "63052",
            "addressCountry": "US"
          }
        },
        "location": {
          "@type": "Place",
          "name": "Seckman High School",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Imperial",
            "addressRegion": "MO",
            "addressCountry": "US"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": 38.3706,
            "longitude": -90.3779
          }
        }
      }
    ]
  }
  </script>
</head>
<body>
  <header class="site-header"></header>

  <main id="main">
    <div class="container">
      <!-- The heading and intro sit outside #weeks on purpose: home.js clears
           that container's innerHTML once the week list loads, and this copy is
           the only thing a crawler without JS ever sees. The heading is
           visually hidden: the header already shows the name, and the hero
           photo should be the first thing on screen. -->
      <h1 class="sr-only">Seckman Jaguars Football</h1>
      <!-- Filled by home.js. Both hold their final size from the first paint so
           nothing below them jumps when the week list lands. -->
      <a class="home-hero" id="home-hero" aria-label="Latest game"></a>
      <a class="next-up" id="next-up" href="/schedule" aria-label="Next game"></a>
      <div id="weeks">
        <p class="sr-only" role="status">Loading photos</p>
        <div class="week-grid" aria-hidden="true">
          <div class="skeleton-card">
            <div class="skeleton skeleton-cover"></div>
            <div class="skeleton-body">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton skeleton-cover"></div>
            <div class="skeleton-body">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton skeleton-cover"></div>
            <div class="skeleton-body">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
        </div>
        <noscript><p class="empty-state">Photos need JavaScript enabled to load.</p></noscript>
      </div>
      <section class="archive-section year-section" id="photo-banner" aria-labelledby="archive-heading">
        <h2 id="archive-heading">From the Archives</h2>
        <div class="archive-carousel">
          <div class="photo-banner" id="photo-banner-scroller">
            <div class="photo-banner-track" id="photo-banner-track"></div>
          </div>
          <button class="archive-arrow prev" type="button" aria-label="Previous photos">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="archive-arrow next" type="button" aria-label="Next photos">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </section>
      <!-- Below the photos rather than above them, so the page reads game to
           game; the text is still here for search engines. -->
      <p class="page-intro home-outro">
        Game photos for Seckman Jaguars football in Imperial, MO, posted week by week
        all season. Browse by game and grab the full-resolution photos for free.
      </p>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/js/home.js" type="module"></script>
</body>
</html>
