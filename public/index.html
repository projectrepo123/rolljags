<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jaguar Football</title>
  <link rel="icon" href="/logo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta property="og:title" content="Jaguar Football" />
  <meta property="og:description" content="Season photos for Jaguar Football. Browse by week and download full-resolution photos." />
  <meta property="og:image" content="https://rolljags.com/logo.webp" />
  <meta property="og:url" content="https://rolljags.com/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <img class="site-logo" src="/logo.webp" alt="Jaguar Football logo" />
        <h1>Jaguar Football</h1>
      </div>
      <nav class="site-nav">
        <a href="/" class="active">Photos</a>
        <a href="/history">History</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-inner">
      <p class="hero-kicker">Jaguar Football</p>
      <h2 class="hero-title">Game Day,<br />Captured</h2>
      <p class="hero-tagline">Season Photos</p>
      <p class="hero-body">Browse every week, every season — free to view and download.</p>
      <div class="hero-actions">
        <a href="#weeks" class="btn btn-gold">View This Week's Photos</a>
        <a href="/history" class="btn btn-outline">Team History</a>
      </div>
    </div>
  </section>

  <main>
    <div class="container">
      <div id="weeks">
        <p class="empty-state">Loading weeks…</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Jaguar Football</p>
      <p class="footer-credit">Photos by <a href="https://jbwebco.com">Jon Baer</a></p>
    </div>
  </footer>

  <script src="/js/home.js" type="module"></script>
</body>
</html>
