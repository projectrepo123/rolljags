<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- One HTML file serves every season, so description/canonical/og:* are
       injected per year by the worker (worker/lib/meta.js). Static copies here
       would sit earlier in <head> and win, making every shared season link
       preview as the same generic page. <title> is safe to keep: the rewriter
       replaces its contents rather than appending a second one. -->
  <title>Season | Seckman Jaguars Football</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#142c52" />
  <!-- @font-face lives inside the render-blocking stylesheet, so without this
       the font request cannot start until the CSS has parsed and the masthead
       visibly reflows. crossorigin is required even same-origin for fonts. -->
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header"></header>

  <main id="main">
    <div class="container">
      <a class="back-link" href="/history">&larr; All seasons</a>
      <h1 class="season-title loading" id="season-title">Loading…</h1>
      <div class="season-record" id="season-record"></div>
      <div class="table-scroll">
        <table class="season-table" id="season-table">
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Opponent</th>
              <th scope="col">H/A</th>
              <th scope="col">Result</th>
              <th scope="col">Game Type</th>
            </tr>
          </thead>
          <tbody id="season-tbody">
          </tbody>
        </table>
      </div>
      <div id="season-status"></div>
      <section id="season-leaders"></section>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/js/season.js" type="module"></script>
</body>
</html>
