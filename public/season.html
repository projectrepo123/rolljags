<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- One HTML file serves every season, so description/canonical/og:* are
       injected per year by the worker (worker/lib/meta.js). Static copies here
       would sit earlier in <head> and win, making every shared season link
       preview as the same generic page. <title> is safe to keep: the rewriter
       replaces its contents rather than appending a second one. -->
  <title>Season | Seckman Jaguars Football</title>
  <link rel="icon" href="/logo.webp" type="image/webp" />
  <!-- @font-face lives inside the render-blocking stylesheet, so without this
       the font request cannot start until the CSS has parsed and the masthead
       visibly reflows. crossorigin is required even same-origin for fonts. -->
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img class="site-logo" src="/logo.webp" alt="Jaguar Football logo" />
        <span class="brand-name">Jaguar Football</span>
      </a>
      <nav class="site-nav">
        <div class="nav-links" id="nav-links">
          <a href="/">Photos</a>
          <a href="/schedule">Schedule</a>
          <a href="/history" class="active">History</a>
          <a href="/records">Records</a>
          <a href="/podcast">Podcast</a>
        </div>
        <span class="kickoff-countdown" id="kickoff-countdown" hidden>
          <span class="kickoff-label" id="kickoff-label">Kickoff</span>
          <span class="kickoff-clock" id="kickoff-clock"></span>
        </span>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <a class="back-link" href="/history">&larr; All seasons</a>
      <h1 class="season-title loading" id="season-title">Loading…</h1>
      <div class="season-record" id="season-record"></div>
      <div class="table-scroll">
        <table class="season-table" id="season-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>H/A</th>
              <th>Result</th>
              <th>Game Type</th>
            </tr>
          </thead>
          <tbody id="season-tbody">
          </tbody>
        </table>
      </div>
      <div id="season-status"></div>
      <section id="season-leaders"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Jaguar Football</p>
      <p class="footer-credit">Photos and Website by <a href="https://jbwebco.com">Jon Baer</a></p>
    </div>
  </footer>

  <script src="/js/season.js" type="module"></script>
</body>
</html>
