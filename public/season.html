<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jaguar Football</title>
  <link rel="icon" href="/logo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img class="site-logo" src="/logo.webp" alt="Jaguar Football logo" />
        <h1>Jaguar Football</h1>
      </a>
      <nav class="site-nav">
        <a href="/">Photos</a>
        <a href="/history" class="active">History</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <a class="back-link" href="/history">&larr; All seasons</a>
      <h2 class="season-title loading" id="season-title">Loading…</h2>
      <div class="season-record" id="season-record"></div>
      <div class="table-scroll">
        <table class="season-table" id="season-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>H/A</th>
              <th>Result</th>
              <th>Game Type</th>
            </tr>
          </thead>
          <tbody id="season-tbody">
          </tbody>
        </table>
      </div>
      <div id="season-status"></div>
      <section id="season-leaders"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Jaguar Football</p>
      <p class="footer-credit">Photos by <a href="https://jbwebco.com">Jon Baer</a></p>
      <p class="footer-credit">Podcast: <a href="https://www.youtube.com/results?search_query=Jaguar+Football+Booster+Club+">YouTube</a> · <a href="https://open.spotify.com/show/01Jjwj9inswEPj5tM3xdkR?si=e4b15cc70feb4924">Spotify</a></p>
    </div>
  </footer>

  <script src="/js/season.js" type="module"></script>
</body>
</html>
