<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Season | Jaguar Football</title>
  <link rel="icon" href="/logo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="description" content="Full game-by-game results and scoring leaders for a Jaguar Football season." />
  <meta property="og:title" content="Season | Jaguar Football" />
  <meta property="og:description" content="Full game-by-game results and scoring leaders for a Jaguar Football season." />
  <meta property="og:image" content="https://rolljags.com/logo.webp" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img class="site-logo" src="/logo.webp" alt="Jaguar Football logo" />
        <h1>Jaguar Football</h1>
      </a>
      <nav class="site-nav">
        <div class="nav-links" id="nav-links">
          <a href="/">Photos</a>
          <a href="/history" class="active">History</a>
          <a href="/podcast">Podcast</a>
          <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">
            <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle-label">Dark mode</span>
          </button>
        </div>
        <span class="kickoff-countdown" id="kickoff-countdown" hidden></span>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <a class="back-link" href="/history">&larr; All seasons</a>
      <h2 class="season-title" id="season-title">Loading…</h2>
      <div class="season-record" id="season-record"></div>
      <div class="table-scroll">
        <table class="season-table" id="season-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>H/A</th>
              <th>Result</th>
              <th>Game Type</th>
            </tr>
          </thead>
          <tbody id="season-tbody">
          </tbody>
        </table>
      </div>
      <div id="season-status"></div>
      <section id="season-leaders"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Jaguar Football</p>
      <p class="footer-credit">Photos and Website by <a href="https://jbwebco.com">Jon Baer</a></p>
    </div>
  </footer>

  <script src="/js/season.js" type="module"></script>
</body>
</html>
