<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seckman Jaguars Football History | Imperial, MO</title>
  <link rel="icon" href="/logo.webp" type="image/webp" />
  <!-- @font-face lives inside the render-blocking stylesheet, so without this
       the font request cannot start until the CSS has parsed and the masthead
       visibly reflows. crossorigin is required even same-origin for fonts. -->
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="description" content="Team history for Seckman High School Jaguars football in Imperial, MO. Season records, all-time scoring leaders, and game results from 1999 to today." />
  <link rel="canonical" href="https://rolljags.com/history" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <meta property="og:title" content="Seckman Jaguars Football History | Imperial, MO" />
  <meta property="og:description" content="Team history for Seckman High School Jaguars football in Imperial, MO. Season records, all-time scoring leaders, and game results from 1999 to today." />
  <meta property="og:image" content="https://rolljags.com/logo.webp" />
  <meta property="og:url" content="https://rolljags.com/history" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img class="site-logo" src="/logo.webp" alt="Jaguar Football logo" />
        <span class="brand-name">Jaguar Football</span>
      </a>
      <nav class="site-nav">
        <div class="nav-links" id="nav-links">
          <a href="/">Photos</a>
          <a href="/schedule">Schedule</a>
          <a href="/history" class="active">History</a>
          <a href="/records">Records</a>
          <a href="/podcast">Podcast</a>
        </div>
        <span class="kickoff-countdown" id="kickoff-countdown" hidden>
          <span class="kickoff-label" id="kickoff-label">Kickoff</span>
          <span class="kickoff-clock" id="kickoff-clock"></span>
        </span>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Seckman Jaguars Football History</h1>
      <section id="leaderboards"></section>
      <section id="headToHead"></section>
      <div id="seasons">
        <p class="sr-only" role="status">Loading seasons</p>
        <div class="week-grid" aria-hidden="true">
          <div class="skeleton skeleton-season"></div>
          <div class="skeleton skeleton-season"></div>
          <div class="skeleton skeleton-season"></div>
          <div class="skeleton skeleton-season"></div>
        </div>
        <noscript><p class="empty-state">Season history needs JavaScript enabled to load.</p></noscript>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Jaguar Football</p>
      <p class="footer-credit">Photos and Website by <a href="https://jbwebco.com">Jon Baer</a></p>
    </div>
  </footer>

  <script src="/js/history.js" type="module"></script>
</body>
</html>
