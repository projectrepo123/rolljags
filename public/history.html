<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seckman Jaguars Football History | Imperial, MO</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#142c52" />
  <!-- @font-face lives inside the render-blocking stylesheet, so without this
       the font request cannot start until the CSS has parsed and the masthead
       visibly reflows. crossorigin is required even same-origin for fonts. -->
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="description" content="Team history for Seckman High School Jaguars football in Imperial, MO. Season records, all-time scoring leaders, and game results from 1999 to today." />
  <link rel="canonical" href="https://rolljags.com/history" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <meta property="og:title" content="Seckman Jaguars Football History | Imperial, MO" />
  <meta property="og:description" content="Team history for Seckman High School Jaguars football in Imperial, MO. Season records, all-time scoring leaders, and game results from 1999 to today." />
  <meta property="og:site_name" content="Seckman Jaguars Football" />
  <meta property="og:image" content="https://rolljags.com/og-default.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://rolljags.com/history" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="site-header"></header>

  <main id="main">
    <section class="page-hero page-hero-history">
      <div class="container">
        <h1><span class="h1-kicker">Seckman Jaguars Football</span> History</h1>
      </div>
    </section>
    <div class="container">
      <div id="seasons">
        <p class="sr-only" role="status">Loading seasons</p>
        <div class="week-grid" aria-hidden="true">
          <div class="skeleton skeleton-season"></div>
          <div class="skeleton skeleton-season"></div>
          <div class="skeleton skeleton-season"></div>
          <div class="skeleton skeleton-season"></div>
        </div>
        <noscript><p class="empty-state">Season history needs JavaScript enabled to load.</p></noscript>
      </div>
      <!-- Seasons first: they're what this page is for, and on a phone the
           leader cards used to push them about 3,000px down. -->
      <section id="headToHead"></section>
      <section id="leaderboards"></section>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/js/history.js" type="module"></script>
</body>
</html>
