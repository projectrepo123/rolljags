<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- One HTML file serves every player, so description/canonical/og:* and the
       heading are injected per player by the worker (worker/lib/meta.js). -->
  <title>Player | Seckman Jaguars Football</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#142c52" />
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header"></header>

  <main id="main">
    <section class="page-hero page-hero-roster page-hero-player">
      <div class="container">
        <a class="back-link" href="/roster">&larr; Full roster</a>
        <h1 id="player-title">Player</h1>
        <span class="player-number" id="player-number" aria-hidden="true"></span>
      </div>
    </section>
    <div class="container">
      <div id="player-records"></div>
      <div id="player-status"></div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/js/player.js" type="module"></script>
</body>
</html>
