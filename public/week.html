<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seckman Jaguars Football</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#142c52" />
  <!-- @font-face lives inside the render-blocking stylesheet, so without this
       the font request cannot start until the CSS has parsed and the masthead
       visibly reflows. crossorigin is required even same-origin for fonts. -->
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header"></header>
  <nav class="score-strip" id="score-strip" data-year="2026" aria-label="Season scores"></nav>

  <main id="main">
    <section class="page-hero page-hero-week">
      <div class="container">
        <a class="back-link" href="/">&larr; All weeks</a>
        <p class="week-eyebrow" id="week-eyebrow"></p>
        <h1 class="week-title" id="week-title">Loading…</h1>
      </div>
    </section>
    <div class="container">
      <div class="scoreboard" id="scoreboard" hidden></div>
      <p class="week-caption" id="week-caption"></p>
      <p class="week-more-coming" id="week-more-coming" hidden>More photos from this game are still going up. Check back soon.</p>
      <div class="level-tabs" id="level-tabs"></div>
      <div class="level-toolbar" id="level-toolbar"></div>
      <p class="sr-only" role="status">Loading photos</p>
      <div class="photo-grid" id="photo-grid">
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
      </div>
      <div id="week-status"></div>
      <noscript><p class="empty-state">Photos need JavaScript enabled to load.</p></noscript>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/js/gallery.js" type="module"></script>
  <script src="/js/score-strip.js" type="module"></script>
</body>
</html>
