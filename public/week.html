<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jaguar Football</title>
  <link rel="icon" href="/logo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img class="site-logo" src="/logo.webp" alt="Jaguar Football logo" />
        <h1>Jaguar Football</h1>
      </a>
      <nav class="site-nav">
        <div class="nav-links" id="nav-links">
          <a href="/">Photos</a>
          <a href="/history">History</a>
          <a href="/records">Records</a>
          <a href="/podcast">Podcast</a>
        </div>
        <span class="kickoff-countdown" id="kickoff-countdown" hidden>
          <span class="kickoff-label" id="kickoff-label">Kickoff</span>
          <span class="kickoff-clock" id="kickoff-clock"></span>
        </span>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <a class="back-link" href="/">&larr; All weeks</a>
      <h2 class="week-title" id="week-title">Loading…</h2>
      <p class="week-caption" id="week-caption"></p>
      <div class="level-tabs" id="level-tabs"></div>
      <div class="level-toolbar" id="level-toolbar"></div>
      <p class="sr-only" role="status">Loading photos</p>
      <div class="photo-grid" id="photo-grid">
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
        <div class="skeleton skeleton-thumb"></div>
      </div>
      <div id="week-status"></div>
      <noscript><p class="empty-state">Photos need JavaScript enabled to load.</p></noscript>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Jaguar Football</p>
      <p class="footer-credit">Photos and Website by <a href="https://jbwebco.com">Jon Baer</a></p>
    </div>
  </footer>

  <script src="/js/gallery.js" type="module"></script>
</body>
</html>
