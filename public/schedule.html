<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Schedule | Jaguar Football</title>
  <link rel="icon" href="/logo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="description" content="Jaguar Football 2026 schedule: game dates, opponents, and home/away for every week of the season." />
  <link rel="canonical" href="https://rolljags.com/schedule" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <meta property="og:title" content="2026 Schedule | Jaguar Football" />
  <meta property="og:description" content="Jaguar Football 2026 schedule: game dates, opponents, and home/away for every week of the season." />
  <meta property="og:image" content="https://rolljags.com/logo.webp" />
  <meta property="og:url" content="https://rolljags.com/schedule" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <img class="site-logo" src="/logo.webp" alt="Jaguar Football logo" />
        <h1>Jaguar Football</h1>
      </a>
      <nav class="site-nav">
        <div class="nav-links" id="nav-links">
          <a href="/">Photos</a>
          <a href="/schedule" class="active">Schedule</a>
          <a href="/history">History</a>
          <a href="/records">Records</a>
          <a href="/podcast">Podcast</a>
        </div>
        <span class="kickoff-countdown" id="kickoff-countdown" hidden>
          <span class="kickoff-label" id="kickoff-label">Kickoff</span>
          <span class="kickoff-clock" id="kickoff-clock"></span>
        </span>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <div class="photo-banner" id="photo-banner" hidden aria-hidden="true">
      <div class="photo-banner-track" id="photo-banner-track"></div>
    </div>
    <div class="container">
      <h2 id="schedule-title">2026 Schedule</h2>
      <div class="table-scroll">
        <table class="season-table" id="schedule-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>H/A</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="schedule-tbody">
          </tbody>
        </table>
      </div>
      <div id="schedule-status"></div>
      <noscript><p class="empty-state">The schedule needs JavaScript enabled to load.</p></noscript>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Jaguar Football</p>
      <p class="footer-credit">Photos and Website by <a href="https://jbwebco.com">Jon Baer</a></p>
    </div>
  </footer>

  <script src="/js/schedule.js" type="module"></script>
</body>
</html>
