<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 Roster | Seckman Jaguars Football</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#142c52" />
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="description" content="The 2026 Seckman High School Jaguars football roster: numbers, positions and classes for every player." />
  <link rel="canonical" href="https://rolljags.com/roster" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <meta property="og:title" content="2026 Roster | Seckman Jaguars Football" />
  <meta property="og:description" content="The 2026 Seckman High School Jaguars football roster: numbers, positions and classes for every player." />
  <meta property="og:site_name" content="Seckman Jaguars Football" />
  <meta property="og:image" content="https://rolljags.com/og-default.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://rolljags.com/roster" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="site-header"></header>

  <main id="main">
    <section class="page-hero page-hero-roster">
      <div class="container">
        <h1><span class="h1-kicker">Seckman Jaguars Football</span> 2026 Roster</h1>
        <!-- The worker fills these counts and the table rows below from
             public/data/roster.json (see worker/lib/roster.js). To change the
             roster, edit that file. -->
        <p class="page-intro" id="roster-intro">61 players: 21 seniors, 32 juniors and 8 sophomores.</p>
      </div>
    </section>
    <div class="container roster-page">
      <!-- roster.js builds the filters and the position groups from the
           table rows, then hides the table. Without JavaScript the table is
           the roster. -->
      <div class="roster-filters" id="roster-filters" hidden></div>
      <div class="roster-list" id="roster-grid" hidden></div>
      <div class="table-scroll" id="roster-table">
        <table class="season-table roster-table">
          <caption class="sr-only">2026 Seckman Jaguars varsity roster, by jersey number</caption>
          <thead>
            <tr><th scope="col">No.</th><th scope="col">Name</th><th scope="col">Pos.</th><th scope="col">Class</th></tr>
          </thead>
          <tbody id="roster-tbody">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/js/roster.js" type="module"></script>
</body>
</html>
