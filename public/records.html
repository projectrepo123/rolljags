<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seckman Jaguars Football Record Book | Imperial, MO</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#142c52" />
  <!-- @font-face lives inside the render-blocking stylesheet, so without this
       the font request cannot start until the CSS has parsed and the masthead
       visibly reflows. crossorigin is required even same-origin for fonts. -->
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="description" content="Career, single-season and single-game records for Seckman High School Jaguars football in Imperial, MO. Scoring, passing, rushing, receiving, defense and special teams." />
  <link rel="canonical" href="https://rolljags.com/records" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <meta property="og:title" content="Seckman Jaguars Football Record Book | Imperial, MO" />
  <meta property="og:description" content="Career, single-season and single-game records for Seckman High School Jaguars football in Imperial, MO. Offense, defense and special teams." />
  <meta property="og:site_name" content="Seckman Jaguars Football" />
  <meta property="og:image" content="https://rolljags.com/og-default.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://rolljags.com/records" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="site-header"></header>

  <main id="main">
    <div class="container">
      <h1><span class="h1-kicker">Seckman Jaguars Football</span> Record Book</h1>
      <p class="page-intro">
        Individual records going back to 1999. Each card shows the top five.
        Hit <strong>View all</strong> to search the full list.
      </p>

      <div class="level-tabs" id="scope-tabs" role="tablist" aria-label="Record scope">
        <button class="level-tab active" role="tab" id="tab-career" aria-controls="scope-panel" aria-selected="true" data-scope="career">Career</button>
        <button class="level-tab" role="tab" id="tab-season" aria-controls="scope-panel" aria-selected="false" data-scope="season">Single Season</button>
        <button class="level-tab" role="tab" id="tab-game" aria-controls="scope-panel" aria-selected="false" data-scope="game">Single Game</button>
      </div>

      <div id="scope-panel" role="tabpanel" aria-labelledby="tab-career">
        <p class="sr-only" role="status">Loading records</p>
        <div class="leaderboards-container" aria-hidden="true">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
        <noscript><p class="empty-state">The record book needs JavaScript enabled to load.</p></noscript>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/js/records.js" type="module"></script>
</body>
</html>
