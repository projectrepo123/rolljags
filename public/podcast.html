<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seckman Jaguars Football Podcast | Imperial, MO</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#142c52" />
  <!-- @font-face lives inside the render-blocking stylesheet, so without this
       the font request cannot start until the CSS has parsed and the masthead
       visibly reflows. crossorigin is required even same-origin for fonts. -->
  <link rel="preload" href="/fonts/oswald-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
  <meta name="description" content="The Booster Club podcast for Seckman High School Jaguars football in Imperial, MO. Watch on YouTube, listen on Spotify, and follow the team on Facebook." />
  <link rel="canonical" href="https://rolljags.com/podcast" />
  <script src="/js/theme.js"></script>
  <script src="/js/countdown.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <meta property="og:title" content="Seckman Jaguars Football Podcast | Imperial, MO" />
  <meta property="og:description" content="The Booster Club podcast for Seckman High School Jaguars football in Imperial, MO. Watch on YouTube, listen on Spotify, and follow along on Facebook." />
  <meta property="og:site_name" content="Seckman Jaguars Football" />
  <meta property="og:image" content="https://rolljags.com/og-default.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://rolljags.com/podcast" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
</head>
<body>
  <header class="site-header"></header>

  <main id="main">
    <div class="container podcast-page">
      <h1>Seckman Jaguars Football Podcast</h1>
      <p class="podcast-intro">
        Game breakdowns, player features, and program updates from the Jaguar Football Booster Club.
        Watch or listen below, and
        <a href="https://www.facebook.com/p/Jaguar-Football-Booster-Club-61558713380822/" target="_blank" rel="noopener">follow us on Facebook</a>
        for everything in between.
      </p>

      <section class="podcast-card">
        <h2 class="section-heading">Latest Episodes on YouTube</h2>
        <!-- A live iframe, so the panel shows YouTube's real thumbnail for the
             most recent upload. A click-to-play poster stood here briefly and
             read as a broken embed: built from the logo and type, it looked
             like a placeholder rather than a video. YouTube's own chrome
             overlapping the episode title is the lesser problem. The playlist
             is the channel's uploads feed, so this needs no maintenance as
             episodes are published. -->
        <div class="embed-container">
          <iframe
            src="https://www.youtube.com/embed/videoseries?list=UUc4EJnrY7OlGxHyOHjcEmmw"
            title="Jaguar Football Booster Club YouTube uploads"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
      </section>

      <section class="podcast-card">
        <h2 class="section-heading">Latest Episodes on Spotify</h2>
        <iframe
          class="spotify-embed"
          src="https://open.spotify.com/embed/show/01Jjwj9inswEPj5tM3xdkR?utm_source=generator"
          title="Jaguar Football Booster Club Spotify episodes"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
        ></iframe>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>
</body>
</html>
